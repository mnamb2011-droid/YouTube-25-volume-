name: Build YouTube Brave VolumeCap APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android project structure from flat files
        run: |
          mkdir -p app/src/main/java/com/safeyoutube/brave
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp MainActivity.java app/src/main/java/com/safeyoutube/brave/MainActivity.java
          cp VolumeLimiterService.java app/src/main/java/com/safeyoutube/brave/VolumeLimiterService.java
          cp activity_main.xml app/src/main/res/layout/activity_main.xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YouTubeBraveVolumeCap"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.safeyoutube.brave'
              compileSdk 34

              defaultConfig {
                  applicationId "com.safeyoutube.brave"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.browser:browser:1.8.0'
          }
          EOF

          touch app/proguard-rules.pro

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <package android:name="com.brave.browser" />
                  <package android:name="com.brave.browser_beta" />
                  <package android:name="com.brave.browser_nightly" />
                  <intent>
                      <action android:name="android.support.customtabs.action.CustomTabsService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SafeYouTube">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VolumeLimiterService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Enforces a 25 percent maximum media volume cap while YouTube is open in Brave browser" />
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">YouTube</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SafeYouTube" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#0F0F0F</item>
                  <item name="android:statusBarColor">#0F0F0F</item>
                  <item name="android:navigationBarColor">#0F0F0F</item>
              </style>
          </resources>
          EOF

      - name: Generate mipmap launcher icons
        run: |
          python3 -m pip install -q pillow
          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          def draw_default_icon(size):
              s = size * 4
              img = Image.new("RGBA", (s, s), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              pad = int(s * 0.06)
              d.rounded_rectangle([pad, pad, s - pad, s - pad], radius=int(s * 0.22), fill=(255, 0, 0, 255))
              th = int(s * 0.36)
              tw = int(th * 0.86)
              cx, cy = s // 2 + int(s * 0.02), s // 2
              d.polygon([(cx - tw // 2, cy - th // 2), (cx - tw // 2, cy + th // 2), (cx + tw // 2, cy)], fill=(255, 255, 255, 255))
              return img.resize((size, size), Image.Resampling.LANCZOS)

          base_img = Image.open("icon.png").convert("RGBA") if os.path.exists("icon.png") else draw_default_icon(512)

          for folder, px in densities.items():
              out_dir = f"app/src/main/res/{folder}"
              resized = base_img.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(f"{out_dir}/ic_launcher.png")

              mask = Image.new("L", (px, px), 0)
              ImageDraw.Draw(mask).ellipse([0, 0, px - 1, px - 1], fill=255)
              round_img = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              round_img.paste(resized, (0, 0), mask)
              round_img.save(f"{out_dir}/ic_launcher_round.png")
          PYEOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Brave-VolumeCap-APK
          path: app/build/outputs/apk/debug/app-debug.apk
